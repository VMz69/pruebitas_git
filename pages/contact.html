<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/styles.css">
    <title>Contacto</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h2>Contáctanos</h2>
        <p>Puedes enviarnos un mensaje a través del siguiente formulario:</p>
        <form>
            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre"><br><br>

            <label for="correo">Correo:</label><br>
            <input type="email" id="correo" name="correo" placeholder="tu@correo.com"><br><br>

            <label for="mensaje">Mensaje:</label><br>
            <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje..."></textarea><br><br>

            <button type="submit">Enviar</button>
        </form>
    </main>

</body>

</html>
